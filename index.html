<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para mi Mema ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, 'Times New Roman', serif;
            background:
                radial-gradient(circle at center, #4b1834 0%, #210b18 45%, #10050b 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .contenedor {
            width: 90%;
            max-width: 750px;
            padding: 40px 25px;
            position: relative;
            z-index: 2;
        }

        .corazon {
            font-size: 75px;
            margin-bottom: 15px;
            animation: latido 1.5s infinite;
            filter: drop-shadow(0 0 15px rgba(255, 80, 130, .5));
        }

        .pequeno {
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: .8;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 58px;
            margin-bottom: 12px;
            text-shadow: 0 0 25px rgba(255, 100, 160, .5);
        }

        .frase {
            font-size: 23px;
            font-style: italic;
            line-height: 1.6;
            margin: 20px auto 35px;
            max-width: 600px;
        }

        .fecha {
            font-size: 16px;
            opacity: .7;
            margin-bottom: 30px;
        }

        .boton {
            display: inline-block;
            padding: 16px 40px;
            border-radius: 50px;
            background: #e94678;
            color: white;
            text-decoration: none;
            font-size: 19px;
            transition: .3s;
            box-shadow: 0 0 25px rgba(233, 70, 120, .4);
        }

        .boton:hover {
            transform: scale(1.08);
            background: #ff5d8d;
            box-shadow: 0 0 35px rgba(255, 80, 140, .7);
        }

        .corazones {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .corazones span {
            position: absolute;
            bottom: -60px;
            font-size: 25px;
            opacity: .5;
            animation: subir 9s linear infinite;
        }

        .corazones span:nth-child(1) {
            left: 8%;
            animation-delay: 0s;
        }

        .corazones span:nth-child(2) {
            left: 27%;
            animation-delay: 2s;
        }

        .corazones span:nth-child(3) {
            left: 48%;
            animation-delay: 4s;
        }

        .corazones span:nth-child(4) {
            left: 70%;
            animation-delay: 1s;
        }

        .corazones span:nth-child(5) {
            left: 90%;
            animation-delay: 3s;
        }

        @keyframes latido {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        @keyframes subir {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: .6;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 42px;
            }

            .frase {
                font-size: 19px;
            }

            .corazon {
                font-size: 60px;
            }
        }
    </style>
</head>

<body>

    <div class="corazones">
        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>❤️</span>
        <span>💖</span>
    </div>

    <main class="contenedor">

        <div class="corazon">❤️</div>

        <p class="pequeno">Para el amor de mi vida</p>

        <h1>Para mi Mema</h1>

        <p class="frase">
            “Si no es con vos, no es con nadie ❤️”
        </p>

        <p class="fecha">
            Desde el 25 de septiembre de 2022
        </p>

        <button class="boton" onclick="entrar()">
    Entrá aquí 💕
        </button>

    </main>
    
    <script>
    function entrar() {
        alert("Te amo, Mema ❤️");
    }
</script>

</body>
</html>
